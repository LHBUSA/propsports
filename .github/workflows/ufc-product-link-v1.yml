name: UFC product integration branch builder

on:
  workflow_dispatch:
  push:
    branches:
      - ufc-product-link-v1
    paths:
      - '.github/ufc-product-link.trigger'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ufc-product-link-v1
      - name: Patch PropSports homepage with UFC commercial platform
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          s=s.replace(
            '<title>PropSports API — MLB Prop Odds, Statcast & Live Sports Data | From $19/mo</title>',
            '<title>PropSports API — MLB, NFL, NBA, NHL & UFC Sports Data Infrastructure</title>'
          )
          s=s.replace(
            '<meta name="description" content="59 endpoints. Owned Statcast data. The only sports API that generates its own Poisson model odds — no DraftKings, no FanDuel dependency. MLB, NFL, NBA, NHL. Single sport from $19/mo · All sports $49/mo. Featured in The Globe and Mail.">',
            '<meta name="description" content="Sports data infrastructure for MLB, NFL, NBA, NHL and UFC. Owned Statcast, model odds, live game data, and a dedicated UFC Intelligence API with Fight DNA, weigh-ins, injuries, fighter status and card changes.">'
          )
          s=s.replace(
            '    <a href="/nhl" class="ns-btn">NHL</a>\n',
            '    <a href="/nhl" class="ns-btn">NHL</a>\n    <a href="https://ufc.proptechusa.ai" class="ns-btn" target="_blank" rel="noopener">UFC ↗</a>\n'
          )
          s=s.replace(
            '          <a href="/mlb-edge" class="nav-dd-item">',
            '          <a href="https://ufc.proptechusa.ai" target="_blank" rel="noopener" class="nav-dd-item">\n            <span class="nav-dd-icon">🥊</span>\n            <div>\n              <div class="nav-dd-name">UFC Intelligence API</div>\n              <div class="nav-dd-desc">Fight DNA · weigh-ins · injuries · fighter status · card changes · event intelligence</div>\n              <div class="nav-dd-price">Dedicated developer platform ↗</div>\n            </div>\n          </a>\n          <a href="/mlb-edge" class="nav-dd-item">'
          )
          s=s.replace(
            '  <a href="/nhl">🏒 NHL</a>\n',
            '  <a href="/nhl">🏒 NHL</a>\n  <a href="https://ufc.proptechusa.ai" target="_blank" rel="noopener">🥊 UFC Intelligence ↗</a>\n'
          )
          s=s.replace(
            '        59 Endpoints · MLB · NFL · NBA · NHL',
            '        Sports Infrastructure · MLB · NFL · NBA · NHL · UFC'
          )
          s=s.replace(
            '    <div class="si"><span class="sn">4</span><span class="sl">Sports Covered</span></div>',
            '    <div class="si"><span class="sn">5</span><span class="sl">Sports Platforms</span></div>'
          )
          s=s.replace(
            '<p class="section-lead">One API. Four sports. Statcast intelligence. Model-generated odds. No 20-vendor sprawl.</p>',
            '<p class="section-lead">One sports infrastructure company. MLB, NFL, NBA and NHL through PropSports — plus a purpose-built UFC Intelligence developer platform.</p>'
          )

          css='''\n/* UFC INTELLIGENCE PLATFORM */\n.ufc-platform{background:#0d0d0c;color:#fff;position:relative;overflow:hidden;border-top:1px solid rgba(255,255,255,.06);border-bottom:1px solid rgba(255,255,255,.06);}\n.ufc-platform::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 15% 20%,rgba(215,59,26,.22),transparent 38%),radial-gradient(circle at 88% 80%,rgba(193,127,36,.12),transparent 36%);pointer-events:none;}\n.ufc-platform-grid{position:relative;z-index:1;display:grid;grid-template-columns:1.15fr .85fr;gap:42px;align-items:center;padding:72px 0;}\n.ufc-kicker{display:inline-flex;align-items:center;gap:8px;font:800 10px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:#fff;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.05);padding:6px 11px;border-radius:999px;margin-bottom:16px;}\n.ufc-kicker strong{color:var(--red);}\n.ufc-platform h2{color:#fff;margin-bottom:16px;}\n.ufc-platform h2 em{color:var(--red);font-family:var(--display);font-style:normal;}\n.ufc-copy{font-size:15px;line-height:1.75;color:rgba(255,255,255,.58);max-width:650px;margin-bottom:22px;}\n.ufc-tags{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:26px;}\n.ufc-tag{font:700 10px var(--mono);letter-spacing:.04em;color:rgba(255,255,255,.72);border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);padding:6px 10px;border-radius:999px;}\n.ufc-actions{display:flex;gap:10px;flex-wrap:wrap;}\n.ufc-primary{display:inline-flex;align-items:center;justify-content:center;padding:12px 18px;border-radius:9px;background:var(--red);color:#fff;text-decoration:none;font:800 12px var(--mono);letter-spacing:.04em;box-shadow:0 8px 24px rgba(215,59,26,.28);}\n.ufc-primary:hover{background:var(--red2);transform:translateY(-1px);}\n.ufc-secondary{display:inline-flex;align-items:center;justify-content:center;padding:12px 18px;border-radius:9px;border:1px solid rgba(255,255,255,.18);color:rgba(255,255,255,.78);text-decoration:none;font:700 12px var(--mono);}\n.ufc-secondary:hover{border-color:rgba(255,255,255,.45);color:#fff;}\n.ufc-terminal{background:#151513;border:1px solid rgba(255,255,255,.1);border-radius:16px;box-shadow:0 24px 70px rgba(0,0,0,.35);overflow:hidden;}\n.ufc-terminal-head{display:flex;align-items:center;justify-content:space-between;padding:13px 15px;border-bottom:1px solid rgba(255,255,255,.08);font:700 10px var(--mono);letter-spacing:.1em;color:rgba(255,255,255,.38);}\n.ufc-terminal-head span:last-child{color:#4ade80;}\n.ufc-terminal-body{padding:18px;font:500 11px/1.9 var(--mono);color:#c9d1d9;overflow-x:auto;}\n.ufc-terminal-body .key{color:#7ee787}.ufc-terminal-body .val{color:#79c0ff}.ufc-terminal-body .dim{color:#6e7681}\n@media(max-width:860px){.ufc-platform-grid{grid-template-columns:1fr;padding:52px 0;gap:28px}.ufc-actions>a{width:100%}.ufc-terminal-body{font-size:10px}}\n'''
          s=s.replace('</style>', css+'\n</style>', 1)

          section='''\n<!-- UFC INTELLIGENCE PLATFORM -->\n<section class="ufc-platform" id="ufc-intelligence">\n  <div class="wrap">\n    <div class="ufc-platform-grid">\n      <div>\n        <div class="ufc-kicker"><strong>DEDICATED PLATFORM</strong> · Combat Sports Infrastructure</div>\n        <h2>UFC data built<br><em>beyond the scorecard.</em></h2>\n        <p class="ufc-copy">PropSports now connects directly to our purpose-built UFC Intelligence API — a separate developer platform for teams that need deeper combat-sports infrastructure than a generic sports feed can provide.</p>\n        <div class="ufc-tags">\n          <span class="ufc-tag">Fight DNA</span><span class="ufc-tag">Bout history</span><span class="ufc-tag">Round statistics</span><span class="ufc-tag">Weigh-ins</span><span class="ufc-tag">Injuries</span><span class="ufc-tag">Fighter status</span><span class="ufc-tag">Card changes</span><span class="ufc-tag">Event intelligence</span>\n        </div>\n        <div class="ufc-actions">\n          <a class="ufc-primary" href="https://ufc.proptechusa.ai" target="_blank" rel="noopener">Explore UFC Intelligence API →</a>\n          <a class="ufc-secondary" href="https://ufc.proptechusa.ai/docs" target="_blank" rel="noopener">UFC Developer Docs ↗</a>\n        </div>\n      </div>\n      <div class="ufc-terminal" aria-label="UFC Intelligence API example">\n        <div class="ufc-terminal-head"><span>UFC INTELLIGENCE API</span><span>● LIVE</span></div>\n        <div class="ufc-terminal-body"><span class="dim">// Specialized combat-sports intelligence</span><br><span class="dim">// canonical platform: ufc.proptechusa.ai</span><br><br>{<br>&nbsp;&nbsp;<span class="key">"product"</span>: <span class="val">"UFC Intelligence API"</span>,<br>&nbsp;&nbsp;<span class="key">"capabilities"</span>: [<br>&nbsp;&nbsp;&nbsp;&nbsp;<span class="val">"fight_dna"</span>, <span class="val">"weigh_ins"</span>,<br>&nbsp;&nbsp;&nbsp;&nbsp;<span class="val">"injuries"</span>, <span class="val">"fighter_status"</span>,<br>&nbsp;&nbsp;&nbsp;&nbsp;<span class="val">"card_changes"</span>, <span class="val">"event_intelligence"</span><br>&nbsp;&nbsp;],<br>&nbsp;&nbsp;<span class="key">"delivery"</span>: <span class="val">"REST API"</span><br>}</div>\n      </div>\n    </div>\n  </div>\n</section>\n\n'''
          marker='<!-- PRICING -->'
          if marker not in s: raise SystemExit('pricing marker missing')
          s=s.replace(marker, section+marker, 1)

          s=s.replace(
            '        <a href="/nhl">NHL</a>\n',
            '        <a href="/nhl">NHL</a>\n        <a href="https://ufc.proptechusa.ai" target="_blank" rel="noopener" class="footer-feature-link">UFC Intelligence API →</a>\n'
          )

          p.write_text(s, encoding='utf-8')

      - name: Contract checks
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'https://ufc.proptechusa.ai' index.html
          grep -q 'UFC Intelligence API' index.html
          grep -q 'DEDICATED PLATFORM' index.html
          grep -q 'MLB · NFL · NBA · NHL · UFC' index.html
          test "$(grep -o 'id="ufc-intelligence"' index.html | wc -l)" -eq 1
          git diff --check

      - name: Commit branch update
        shell: bash
        run: |
          git config user.name 'PropSports Release Bot'
          git config user.email 'sales@proptechusa.ai'
          git add index.html
          git commit -m 'feat: connect PropSports to UFC Intelligence platform'
          git push origin HEAD:ufc-product-link-v1
