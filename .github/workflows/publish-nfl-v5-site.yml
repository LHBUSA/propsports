name: Publish PropSports NFL v5 Site

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/publish-nfl-v5-site.yml'
      - 'remove_obsolete_nfl_demo.py'

permissions:
  contents: write

concurrency:
  group: publish-propsports-nfl-v5-site
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Remove obsolete NFL terminal demo
        run: python3 remove_obsolete_nfl_demo.py

      - name: Validate NFL page
        run: |
          git diff --check
          grep -q '59 endpoints' index.html
          grep -q '/nfl/scoreboard' nfl.html
          grep -q '/nfl/game/:id/plays' nfl.html
          grep -q 'id="sandbox"' nfl.html
          if grep -q '// GET /nfl/odds' nfl.html; then
            echo 'Legacy NFL terminal demo is still present.'
            exit 1
          fi
          if grep -q 'propsports-api.sales-fd3.workers.dev</span><span>200 OK' nfl.html; then
            echo 'Legacy NFL terminal chrome is still present.'
            exit 1
          fi

      - name: Commit cleanup
        run: |
          if git diff --quiet; then
            echo 'NFL terminal demo is already removed.'
            exit 0
          fi
          git config user.name 'PropSports Release Bot'
          git config user.email 'sales@proptechusa.ai'
          git add nfl.html
          git commit -m 'Remove obsolete NFL terminal demo'
          git push origin HEAD:main
