name: Build NFL Google Ads Demo

on:
  push:
    branches:
      - feat/nfl-google-ads-landing-20260901
    paths:
      - upgrade_nfl_google_ads_demo.py
      - .github/workflows/build-nfl-google-ads-demo.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-nfl-google-ads-demo
  cancel-in-progress: false

jobs:
  build-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/nfl-google-ads-landing-20260901
          fetch-depth: 0

      - name: Apply sandbox upgrade
        run: python3 upgrade_nfl_google_ads_demo.py

      - name: Validate demo
        run: |
          git diff --check
          grep -q 'Interactive NFL sandbox' nfl.html
          grep -q 'const NFL_SANDBOX_DATA' nfl.html
          grep -q 'Sample shape · not live data' nfl.html
          grep -q 'All 59 endpoints' nfl.html
          grep -q 'data:image/jpeg;base64' nfl.html

      - name: Commit generated landing page
        run: |
          if git diff --quiet; then
            echo 'NFL demo is already generated.'
            exit 0
          fi
          git config user.name 'PropSports Preview Bot'
          git config user.email 'sales@proptechusa.ai'
          git add nfl.html
          git commit -m 'Upgrade NFL landing page sandbox demo'
          git push origin HEAD:feat/nfl-google-ads-landing-20260901
